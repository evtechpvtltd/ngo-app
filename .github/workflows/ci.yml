name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never deploy automatically from untrusted pull requests (app.md #26) —
# this workflow only verifies; it has no deploy step and no secrets are
# exposed to fork PRs (pull_request, not pull_request_target).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      # Safe placeholder values so env validation (lib/config/env.*) and the
      # production build succeed without real Supabase credentials. No
      # secret is real or usable — see .env.example.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_VERSION: 0.0.1
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      APP_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
